name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: monmdp
          POSTGRES_DB: finsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Base jetable du job. psycopg 3 : le schéma doit être postgresql+psycopg.
      DATABASE_URL: postgresql+psycopg://postgres:monmdp@localhost:5432/finsight
      PGPASSWORD: monmdp
      # Aucun appel à Yahoo pendant la CI : la base vide reçoit des séries simulées.
      MARKET_REFRESH_ON_START: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting for Postgres... ($i/10)"
            sleep 2
          done

      # Les tables sont créées par l'application (app.main). Sans réseau, ensure_market_data
      # remplit la base vide avec des séries simulées, marquées comme telles.
      - name: Create tables and seed simulated quotes
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -c "import app.main; from app.database import SessionLocal; from app.market_refresh import ensure_market_data; db = SessionLocal(); ensure_market_data(db); db.close()"

      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t finsight-backend ./backend
