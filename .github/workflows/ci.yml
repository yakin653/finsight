name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: monmdp
          POSTGRES_DB: finsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:monmdp@localhost:5432/finsight
      PGPASSWORD: monmdp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting for Postgres... ($i/10)"
            sleep 2
          done

      - name: Create tables
        run: |
          psql -h localhost -U postgres -d finsight <<'SQL'
            CREATE TABLE IF NOT EXISTS market_data (
              "Date" TIMESTAMP NOT NULL,
              "Open" DOUBLE PRECISION,
              "High" DOUBLE PRECISION,
              "Low" DOUBLE PRECISION,
              "Close" DOUBLE PRECISION,
              "Volume" BIGINT,
              symbol TEXT NOT NULL,
              PRIMARY KEY (symbol, "Date")
            );
            CREATE TABLE IF NOT EXISTS news (
              id SERIAL PRIMARY KEY,
              symbol TEXT NOT NULL,
              date TIMESTAMP NOT NULL,
              headline TEXT NOT NULL,
              url TEXT,
              source TEXT,
              pos DOUBLE PRECISION,
              neu DOUBLE PRECISION,
              neg DOUBLE PRECISION,
              UNIQUE (symbol, date, headline)
            );
          SQL

      - name: Seed test data
        run: |
          psql -h localhost -U postgres -d finsight <<'SQL'
            DO $$
            DECLARE
                i INT;
                d DATE;
            BEGIN
                FOR i IN 0..60 LOOP
                    d := '2024-01-01'::date + i;
                    INSERT INTO market_data VALUES
                        (d, 100 + i, 105 + i, 99 + i, 104 + i, 1000000, 'AAPL');
                END LOOP;
            END $$;
          SQL

      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t finsight-backend ./backend