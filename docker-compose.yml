services:
  # --- PostgreSQL ---
  db:
    image: postgres:16
    container_name: finsight-db
    environment:
      POSTGRES_PASSWORD: monmdp
      POSTGRES_DB: finsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Backend FastAPI ---
  backend:
    build: ./backend
    container_name: finsight-backend
    environment:
      DATABASE_URL: postgresql://postgres:monmdp@db:5432/finsight
      OLLAMA_URL: http://host.docker.internal:11434/v1/chat/completions
    ports:
      - "8000:8000"
    volumes:
      - ./ml:/ml
      - ./ml/models:/ml/models
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 5s

volumes:
  pgdata: